name: Importar Baltigo Ads

# Importa o pacote original sem alterar as imagens ou reescrever o layout.
# O envio deste arquivo de workflow, sozinho, NAO substitui a pagina atual.
on:
  push:
    branches: [main]
    paths:
      - baltigo-ads-redesign.zip
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: importar-baltigo-ads-main
  cancel-in-progress: false

jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obter o repositorio
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verificar e extrair o pacote original
        shell: python
        run: |
          import hashlib
          import stat
          import zipfile
          from pathlib import Path, PurePosixPath

          package = Path('baltigo-ads-redesign.zip')
          if not package.is_file():
              raise SystemExit('Envie baltigo-ads-redesign.zip para a raiz deste repositorio primeiro.')
          expected_sha256 = '59551f9370a1daa0ced864ec73fc838dbfc7025faae7cc41d37ac1686a621cbf'
          if hashlib.sha256(package.read_bytes()).hexdigest() != expected_sha256:
              raise SystemExit('O ZIP nao corresponde ao pacote original verificado. Nenhum arquivo foi substituido.')

          allowed = {
              'LEIA-ME.md', 'index.html', 'script.js', 'styles.css',
              'assets/animes.webp', 'assets/brand.webp', 'assets/cinema.webp',
              'assets/favicon.png', 'assets/hqs.webp', 'assets/logo-original.webp',
              'assets/mangas.webp', 'assets/novels.webp',
              'previas/celular.png', 'previas/computador.png',
              'previas/formatos-interativos.png', 'previas/pagina-completa.png',
              'testes/verificacao.json',
          }
          payloads = {}
          with zipfile.ZipFile(package) as archive:
              for entry in archive.infolist():
                  if entry.is_dir():
                      continue
                  name = PurePosixPath(entry.filename)
                  if name.is_absolute() or '..' in name.parts or name.parts[0] != 'baltigo-ads':
                      raise SystemExit('Caminho invalido dentro do ZIP.')
                  relative = str(name.relative_to('baltigo-ads'))
                  if relative not in allowed or relative in payloads:
                      raise SystemExit('Arquivo inesperado ou duplicado: ' + relative)
                  if stat.S_ISLNK(entry.external_attr >> 16):
                      raise SystemExit('Links simbolicos nao sao permitidos.')
                  payloads[relative] = archive.read(entry)
          if set(payloads) != allowed:
              raise SystemExit('O pacote esta incompleto. Nenhum arquivo foi substituido.')
          for relative, data in payloads.items():
              target = Path(relative)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
          Path('.nojekyll').touch()
          print('17 arquivos originais verificados e extraidos, incluindo todas as imagens.')

      - name: Registrar a nova pagina na branch main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html styles.css script.js LEIA-ME.md assets previas testes .nojekyll
          if git diff --cached --quiet; then
            echo 'A versao original ja esta no repositorio.'
            exit 0
          fi
          git commit -m 'feat: import complete Baltigo Ads redesign with original images'
          git push origin HEAD:main
          echo 'Codigo, imagens, previas e documentacao enviados para main.'
